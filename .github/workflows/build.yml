# CI: run the tests on every push and pull request. On a version tag (v*) in the PUBLIC repository only
# (nimwegenLab/ShelfBlazer) also build the linux/amd64 image from the Dockerfile, push it to ghcr.io and attach it
# to a GitHub Release as shelfblazer-<tag>.tar.gz. The private working repository never builds or publishes images.
# The tag must be vMAJOR.MINOR.PATCH and equal the version in app/pyproject.toml, with a matching CHANGELOG.md section.
#   git tag v0.1.0 && git push origin v0.1.0
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: |
          pip install -r requirements.txt
          pip install -e packages -e app
      - run: python -W error::ResourceWarning -m unittest discover -s packages/tests
      - run: python -W error::ResourceWarning -m unittest discover -s app/tests

  image:
    needs: test
    if: github.repository == 'nimwegenLab/ShelfBlazer' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and attach the archive
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against the declared version and the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag must look like v1.2.3"; exit 1; }
          for f in app/pyproject.toml packages/pyproject.toml; do
            [ "$(sed -n 's/^version = "\(.*\)"/\1/p' "$f")" = "$VERSION" ] || { echo "$f does not declare $VERSION"; exit 1; }
          done
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Registry copy (for a VM that is allowed to reach ghcr.io).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Archive copy named like the local build (shelfblazer:<version>), for manual transfer: gunzip -c ... | docker load
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: shelfblazer:${{ env.VERSION }}
          outputs: type=docker,dest=${{ runner.temp }}/shelfblazer.tar
          cache-from: type=gha
      - run: gzip -c "$RUNNER_TEMP/shelfblazer.tar" > "shelfblazer-$VERSION.tar.gz"
      # Release notes = this version's section of CHANGELOG.md, plus how to use the archive.
      # Downloadable from the Releases page without a GitHub login (the gh CLI is preinstalled on the runner).
      - run: |
          awk -v v="$VERSION" '/^## \[/{p=index($0,"## [" v "]")==1; next} p' CHANGELOG.md > notes.md
          printf '\nImage archive: `gunzip -c shelfblazer-%s.tar.gz | docker load` (image `shelfblazer:%s`, linux/amd64).\n' "$VERSION" "$VERSION" >> notes.md
          gh release create "$GITHUB_REF_NAME" "shelfblazer-$VERSION.tar.gz" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
