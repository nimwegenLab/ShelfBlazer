[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfblazer-app"
version = "0.1.0"
description = "ShelfBlazer web app: FastAPI pages and the shelfblazer command line"
requires-python = ">=3.10"
dependencies = ["shelfblazer", "fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9", "itsdangerous>=2.1"]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
shelfblazer = "shelfblazer_app.cli:main"

[tool.setuptools]
packages = ["shelfblazer_app"]

[tool.setuptools.package-data]
shelfblazer_app = ["templates/*.html", "static/*", "static/themes/*", "static/icons.svg", "static/LICENSE-fontawesome.txt"]
