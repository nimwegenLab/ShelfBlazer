{% if can_scan %}<button type="button" id="scan-open" class="scan-open" title="Read a barcode with the camera">{{ svg('barcode') }}Scan</button>
<dialog id="scan" class="scan" aria-label="Scan a barcode"><video playsinline muted></video><p class="scan-msg muted" role="status"></p><div class="actions"><button type="button" class="scan-close">Close</button></div></dialog>
<script src="/static/scan.js" defer></script>{% endif %}
