{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block body %}<h1>Sign in</h1>{% if error %}<div class="flash err">{{ error }}</div>{% endif %}
<form method="post" action="/login" class="card-form"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
<label>Username<input name="username" value="{{ username or '' }}" autocomplete="username" autofocus required></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required></label>
<button class="primary">Sign in</button></form>
<p class="muted">New here? <a href="/signup">Create an account</a> (needs the sign-up passphrase).<br>Account created for you? Ask an administrator for a set-password link.</p>{% endblock %}
