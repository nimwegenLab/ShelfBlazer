[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfblazer"
version = "0.3.0"
description = "ShelfBlazer core: git-backed record store, permissions, accounts, search (no web code)"
requires-python = ">=3.10"
dependencies = ["rapidfuzz>=3.9"]

[tool.setuptools]
packages = ["shelfblazer"]
